services:
    SerendipityHQ\Bundle\CommandsQueuesBundle\Admin\Sonata\Entity\DaemonAdmin:
        calls:
            - [ setTemplate, ['show', '@@SHQCommandsQueues/Admin/Sonata/daemon_show.html.twig']]
        tags:
            - { name: sonata.admin, model_class: SerendipityHQ\Bundle\CommandsQueuesBundle\Entity\Daemon, manager_type: orm, group: 'CommandsQueues', label: Daemons, translation_domain: shq_commands_queues, show_mosaic_button: false }
        public: true
    SerendipityHQ\Bundle\CommandsQueuesBundle\Admin\Sonata\Entity\JobAdmin:
        calls:
            - [ setTemplate, ['inner_list_row', '@@SHQCommandsQueues/Admin/Sonata/jobs_inner_list_row.html.twig']]
            - [ setTemplate, ['outer_list_rows_list', '@@SHQCommandsQueues/Admin/Sonata/jobs_list_outer_rows_list.html.twig']]
            - [ setTemplate, ['show', '@@SHQCommandsQueues/Admin/Sonata/job_show.html.twig']]
        tags:
            - { name: sonata.admin, model_class: SerendipityHQ\Bundle\CommandsQueuesBundle\Entity\Job, manager_type: orm, group: 'CommandsQueues', label: Jobs, translation_domain: shq_commands_queues, show_mosaic_button: false }
        public: true

    # Register Ansi to HTML converter in Twig
    SerendipityHQ\Bundle\CommandsQueuesBundle\Admin\Sonata\SHQAnsiTheme: ~
    SensioLabs\AnsiConverter\AnsiToHtmlConverter:
        arguments: ['@SerendipityHQ\Bundle\CommandsQueuesBundle\Admin\Sonata\SHQAnsiTheme', true]
    SensioLabs\AnsiConverter\Bridge\Twig\AnsiExtension:
        arguments: ['@SensioLabs\AnsiConverter\AnsiToHtmlConverter']
        tags:
            - { name: twig.extension }
    SerendipityHQ\Bundle\CommandsQueuesBundle\Admin\Sonata\Twig\CommandsQueuesExtension:
        autowire: true
        tags:
            - { name: twig.extension }
